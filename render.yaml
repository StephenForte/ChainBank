# ChainBank — Render Blueprint
#
# Deploys:
#   - Web service (API + dashboard) — signing-capable (receives TREASURY_PRIVATE_KEY)
#   - Daily treasury-monitor cron — email for alerts, no signing credentials
#   - Six-hourly wallet-reconciler cron — signing-capable (receives TREASURY_PRIVATE_KEY)
#   - Shared Postgres (private network only)
#
# Secrets are sync:false so the dashboard prompts once.
# TREASURY_PRIVATE_KEY is declared only on signing-capable services (web +
# wallet-reconciler). The treasury-monitor must never receive it.

databases:
  - name: chainbank-db
    plan: basic-256mb
    databaseName: chainbank
    user: chainbank
    # Private network only — web and cron connect via internal DATABASE_URL.
    ipAllowList: []

services:
  - type: web
    name: chainbank-web
    runtime: node
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /health/live
    # NODE_ENV=production would otherwise omit devDependencies (vite, tsc).
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate:built
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: CHAINBANK_ENVIRONMENT
        value: hosted-development
      - key: LOG_LEVEL
        value: info
      # Funding gates are sync:false — declared here so the keys exist, but the
      # dashboard value is authoritative. A literal `value:` would be reapplied
      # on every Blueprint sync, and Render re-syncs the whole Blueprint whenever
      # this file changes, for any reason. That silently reverted an operator's
      # dashboard flip once already (2026-08-11, wallet-reconciler: the
      # FUNDING_HEALTH_TOKEN commit re-disabled the reconciler for 18 hours), and
      # the same mechanism would re-arm a kill switch mid-incident. Both default
      # to false when unset, so an unset variable fails closed.
      # See docs/runbooks/disable-all-automated-funding.md
      - key: FUNDING_ENABLED
        sync: false
      # Emergency stop. Declared here so halting funding is a one-value edit
      # rather than creating a variable mid-incident. Every signing-capable
      # service must carry it (web + wallet-reconciler). Takes effect on restart.
      - key: FUNDING_KILL_SWITCH
        sync: false
      # Render terminates TLS one hop in front of the service. Never raise this
      # without a matching proxy chain: each extra trusted hop lets a client
      # forge request.ip through X-Forwarded-For, which would defeat per-IP rate
      # limiting and corrupt audit provenance.
      - key: TRUSTED_PROXY_HOPS
        value: '1'
      - key: HOST
        value: 0.0.0.0
      - key: CHAIN_ID
        value: '11155111'
      - key: EMAIL_PROVIDER
        value: resend
      - key: DATABASE_URL
        fromDatabase:
          name: chainbank-db
          property: connectionString
      - key: DATABASE_SSL_CA
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CHAIN_RPC_URL
        sync: false
      - key: TREASURY_ADDRESS
        sync: false
      # Signing secret — web only among the original two services; reconciler
      # also receives it below. Never add to treasury-monitor.
      - key: TREASURY_PRIVATE_KEY
        sync: false
      # Thresholds are version-controlled rather than dashboard-set (decision
      # D3) so an invalid ladder is caught by CI instead of failing the service
      # at boot. Quoted because the config schema parses decimal ETH strings.
      # Ordering must hold: reserve < critical <= warning <= recovery.
      # Keep all three services identical. To change them, see
      # docs/runbooks/change-thresholds-safely.md
      - key: TREASURY_WARNING_BALANCE_ETH
        value: '0.75'
      - key: TREASURY_CRITICAL_BALANCE_ETH
        value: '0.3'
      - key: TREASURY_RECOVERY_BALANCE_ETH
        value: '1.5'
      - key: TREASURY_MINIMUM_RESERVE_ETH
        value: '0.1'
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_OPERATOR_RECIPIENTS
        sync: false
      - key: ALERT_REMINDER_INTERVAL_HOURS
        value: '24'
      # Bearer for GET /health/funding (CB-01). Web only. Share with ForteL2
      # (or other funding consumers); not an API credential row.
      - key: FUNDING_HEALTH_TOKEN
        sync: false

  - type: cron
    name: chainbank-treasury-monitor
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # 13:00 UTC daily — adjust in the dashboard if needed.
    schedule: '0 13 * * *'
    # NODE_ENV=production would otherwise omit devDependencies (vite, tsc).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run cron:treasury-monitor
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: CHAINBANK_ENVIRONMENT
        value: hosted-development
      - key: LOG_LEVEL
        value: info
      # Deliberately a literal here, unlike the signing-capable services: the
      # monitor holds no TREASURY_PRIVATE_KEY and must never fund, so having a
      # Blueprint sync reassert `false` is the desired behavior, not a hazard.
      - key: FUNDING_ENABLED
        value: 'false'
      - key: CHAIN_ID
        value: '11155111'
      - key: EMAIL_PROVIDER
        value: resend
      - key: ALERT_REMINDER_INTERVAL_HOURS
        value: '24'
      - key: DATABASE_URL
        fromDatabase:
          name: chainbank-db
          property: connectionString
      - key: DATABASE_SSL_CA
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CHAIN_RPC_URL
        sync: false
      - key: TREASURY_ADDRESS
        sync: false
      # Must stay identical to web and wallet-reconciler — each process upserts
      # the same treasury row, so a mismatch would flip thresholds back and
      # forth between the processes.
      - key: TREASURY_WARNING_BALANCE_ETH
        value: '0.75'
      - key: TREASURY_CRITICAL_BALANCE_ETH
        value: '0.3'
      - key: TREASURY_RECOVERY_BALANCE_ETH
        value: '1.5'
      - key: TREASURY_MINIMUM_RESERVE_ETH
        value: '0.1'
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_OPERATOR_RECIPIENTS
        sync: false
      # No TREASURY_PRIVATE_KEY here — monitor strips it even if injected.

  - type: cron
    name: chainbank-wallet-reconciler
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # Every 6 hours (PRD §9.3).
    schedule: '0 */6 * * *'
    # NODE_ENV=production would otherwise omit devDependencies (vite, tsc).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run cron:wallet-reconciler
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: CHAINBANK_ENVIRONMENT
        value: hosted-development
      - key: LOG_LEVEL
        value: info
      # sync:false for the same reason as web — and this is the service the
      # 2026-08-11 revert actually hit. A literal 'false' here means every future
      # edit to this file silently stops unattended funding, and the reconciler
      # reports that stop as exit 0 / "run finished successfully" (C15 treats
      # FUNDING_DISABLED as policy, not failure), so nothing alerts.
      - key: FUNDING_ENABLED
        sync: false
      - key: FUNDING_KILL_SWITCH
        sync: false
      - key: CHAIN_ID
        value: '11155111'
      - key: EMAIL_PROVIDER
        value: resend
      - key: RECONCILE_OUTGOING_LOOKBACK_BLOCKS
        value: '20000'
      - key: DATABASE_URL
        fromDatabase:
          name: chainbank-db
          property: connectionString
      - key: DATABASE_SSL_CA
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CHAIN_RPC_URL
        sync: false
      - key: TREASURY_ADDRESS
        sync: false
      # Signing secret group — required when FUNDING_ENABLED=true. Same key as
      # web; never present on treasury-monitor.
      - key: TREASURY_PRIVATE_KEY
        sync: false
      # Must stay identical to web and treasury-monitor (D3 / CI ladder check).
      - key: TREASURY_WARNING_BALANCE_ETH
        value: '0.75'
      - key: TREASURY_CRITICAL_BALANCE_ETH
        value: '0.3'
      - key: TREASURY_RECOVERY_BALANCE_ETH
        value: '1.5'
      - key: TREASURY_MINIMUM_RESERVE_ETH
        value: '0.1'
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_OPERATOR_RECIPIENTS
        sync: false
